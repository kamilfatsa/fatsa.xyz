<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}">
<head>
    {{ partial "head.html" . }}
    <title>{{ .Title }} · {{ site.Title }}</title>
</head>

<body class="body">

<div class="rightcontent">

    <article class="bio content" style="max-width: 760px;">

        <p class="name">
            <a href="/">{{ site.Title }}</a>
        </p>

        <h1 class="tagline" style="font-size:48px; margin-bottom:32px;">
            {{ .Title }}
        </h1>

        {{ .Content }}

        <p style="margin-top:60px;">
            <a href="/">← Back</a>

        </p>

    </article>

</div>

</body>
</html>
